# Custom nginx config used by test/compat_test.py, mounted over
# /etc/nginx/conf.d/default.conf in BOTH images under test.
#
# It intentionally mirrors the stock default.conf's root/index/error-page
# behavior (so the "root" and "404" scenarios still exercise the same
# document root both images ship), while adding a few locations that only
# exist here -- these are what the "custom config" scenarios in
# compat_test.py actually prove: that a config neither image shipped with
# behaves identically on both, i.e. this is a real drop-in replacement at
# the config level, not just "the stock page looks the same".

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # proves a location block defined only in a custom config resolves
    # identically on both images
    location /custom-status {
        default_type text/plain;
        return 200 "custom-config-active\n";
    }

    # proves add_header behaves identically on both images
    location /custom-header {
        add_header X-Compat-Marker "custom-config" always;
        return 204;
    }

    # target for the large-body scenarios; client_max_body_size here is
    # deliberately different from the stock 1m default, to prove a custom
    # directive value is honored the same way on both images
    location /upload {
        client_max_body_size 2m;
        return 200 "upload-ok\n";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
